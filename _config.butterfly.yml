# ========================
# Butterfly 主题配置
# ========================

# 导航栏
nav:
  logo:
  display_title: true
  fixed: true

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  关于: /about/ || fas fa-user

# 社交链接
social:
  fab fa-github: https://github.com/wellorbetter || GitHub
  fas fa-envelope: mailto:1419919418@qq.com || Email

# 首页打字机座右铭
subtitle:
  enable: true
  effect: true
  typed_option:
    loop: true
    typeSpeed: 150
    backSpeed: 50
    startDelay: 300
  source: false
  sub:
    - 项目、AI Agent、移动端与工程实践
    - 记录做成一个工具之前，那些真正有用的判断

# 头像
avatar:
  img: /image/1061286.jpg
  effect: false

# 顶部图配置
index_img: /image/notes-hero.svg
default_top_img: /image/notes-hero.svg
archive_img: /image/notes-hero.svg
tag_img:
tag_per_img:
category_img:
category_per_img:

# 文章封面
cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  position: top
  default_cover:
    - /image/599136.jpg
    - /image/673345.jpg
    - /image/677464.jpg
    - /image/695560.jpg
    - /image/746013.jpg
    - /image/752791.jpg
    - /image/875222.jpg
    - /image/915332.jpg

# favicon
favicon: /img/favicon.png

# 文章信息
post_meta:
  page:
    date_type: created
    date_format: YYYY-MM-DD
    categories: true
    tags: true
    label: true
  post:
    date_type: created
    date_format: YYYY-MM-DD
    categories: true
    tags: true
    label: true

# 文章字数统计（需安装插件，先关闭）
wordcount:
  enable: false

# 目录
toc:
  post: true
  page: false
  number: false
  expand: false
  style_simple: false
  scroll_percent: true

# 代码块
highlight_theme: mac
highlight_copy: true
highlight_lang: true
highlight_shrink: false
highlight_height_limit: false
code_word_wrap: false

# 主题色
theme_color:
  enable: true
  main: "#ff6a00"
  paginator: "#bd4b26"
  button_hover: "#92391d"
  text_selection: "#e8b39f"
  link_color: "#9b3f21"
  meta_color: "#7b746c"
  hr_color: "#ded6cd"
  code-foreground: "#F8F8F2"
  code-background: "rgba(0,0,0,0.67)"
  toc-highlight: "#bd4b26"
  blockquote-padding-color: "#bd4b26"
  blockquote-background-color: "#f4e7df"
  scrollbar-color: "#bd4b26"
  meta-theme-color-light: "#f7f3ed"
  meta-theme-color-dark: "#171512"

# 暗色模式
darkmode:
  enable: true
  button: true
  autoChangeMode: false
  default: light

# 底部
footer:
  owner:
    enable: true
    since: 2022
  custom_text:
  copyright: false

# 侧边栏
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 做工具，也记录过程。这里放项目复盘、移动端与 AI Agent 的工程笔记。
    button:
      enable: true
      icon: fab fa-github
      text: GitHub
      link: https://github.com/wellorbetter
  card_announcement:
    enable: false
  card_recent_post:
    enable: true
    limit: 5
    sort: date
    sort_order:
  card_categories:
    enable: true
    limit: 8
    expand: none
    sort_order:
  card_tags:
    enable: true
    limit: 40
    color: true
    orderby: random
    order: 1
    sort_order:
  card_archives:
    enable: true
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 8
    sort_order:
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    sort_order:

# 动画
animation: true

# 加载动画
preloader:
  enable: true
  source: 1
  pace_css_url:

# 返回顶部
back2top:
  enable: true
  item_show: false
  scroll_percent: true

# 阅读进度条
reading_progress:
  enable: true
  start_at: left
  position: top
  reversed: false
  color: "#37c6c0"
  height: 3px

# 版权声明
post_copyright:
  enable: true
  decode: false
  author_href:
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# 打赏
reward:
  enable: false

# 文章过期提醒
noticeOutdate:
  enable: true
  style: flat
  limit_day: 365
  position: top
  message_prev: 本文已超过
  message_next: 天未更新，部分内容可能已过时。

# 数学公式 KaTeX
math:
  enable: true
  per_page: true
  method: katex
  katex:
    enable: true
    cdn:
      css: https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css
      js: https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.js
      copy_tex_js: https://cdn.jsdelivr.net/npm/katex@latest/dist/contrib/copy-tex.min.js
      copy_tex_css: https://cdn.jsdelivr.net/npm/katex@latest/dist/contrib/copy-tex.min.css

# 自定义注入
inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">
  bottom:
